[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bounded-meta-agent-factory"
version = "0.1.0"
description = "Project 23: Declarative meta-agent factory enforcing recursion depth <= 1, read-only tool allowlists, token budgets, bounded revisions, and versioned artifact registries."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
meta-factory-demo = "meta_factory.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
